name: CI

on:
  push:
    branches: [main, master, ui-studio-polish]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flutter:
    name: Flutter analyze + tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: sqlite for sqflite_common_ffi
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.24.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      # api_smoke_test ходит в живой API — в CI не гоняем.
      - run: flutter test test/car_catalog_test.dart test/widget_test.dart test/full_regression_test.dart

  api:
    name: API lint + dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/api/requirements.txt
      - run: pip install ruff pip-audit
      - run: ruff check app --select F,E9 --output-format github
      - run: pip-audit -r requirements.txt --progress-spinner off

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: >
          semgrep scan --error --metrics=off
          --config p/python --config p/secrets --config p/dockerfile
          server/ tools/
