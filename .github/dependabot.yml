version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pub-minor:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /server/api
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      pip-minor:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /server/api
    schedule:
      interval: monthly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
