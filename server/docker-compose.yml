services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: detapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: detapp
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U detapp -d detapp"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://detapp:${POSTGRES_PASSWORD}@db:5432/detapp
      APP_ENV: production
      JWT_SECRET: ${JWT_SECRET}
      PLATFORM_ADMIN_EMAIL: ${PLATFORM_ADMIN_EMAIL:-admin@det-app.ru}
      PLATFORM_ADMIN_PASSWORD: ${PLATFORM_ADMIN_PASSWORD}
      PLATFORM_ADMIN_NAME: ${PLATFORM_ADMIN_NAME:-Platform Admin}
      PLATFORM_ADMIN_PHONE: ${PLATFORM_ADMIN_PHONE:-}
      OWNER_DESTRUCTIVE_PIN: ${OWNER_DESTRUCTIVE_PIN:-9294}
      RELEASES_DIR: /data/releases
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://api.det-app.ru}
      RELEASE_UPLOAD_TOKEN: ${RELEASE_UPLOAD_TOKEN}
    volumes:
      - releases_data:/data/releases
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./website:/srv/website:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  db-backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_HOST: db
      POSTGRES_USER: detapp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: detapp
      BACKUP_DIR: /backups
      RETENTION: "14"
    volumes:
      - ./backup/backup.sh:/backup.sh:ro
      - ./backup/loop.sh:/loop.sh:ro
      - pg_backups:/backups
    entrypoint: ["/bin/sh", "/loop.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  releases_data:
  pg_backups:
